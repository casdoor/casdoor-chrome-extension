name: Release
on:
  push:
    branches:
      - master
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: yarn install
      - name: Release
        if: github.event_name == 'push' && github.repository == 'casdoor/casdoor-chrome-extension'
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        id: package
        if: github.event_name == 'push' && github.repository == 'casdoor/casdoor-chrome-extension'
        run: |
          tag=$(git tag --points-at HEAD | grep '^v' | head -n 1)
          if [ -z "$tag" ]; then
            echo "No new release, nothing to package"
            exit 0
          fi
          # the version only lives in the tag, it is written into the manifest here and not committed
          node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("manifest.json")); m.version = process.argv[1]; fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n")' "${tag#v}"
          zip -r casdoor-extension.zip manifest.json src images vendor
          # the captcha model and ONNX Runtime are in vendor/, a package without them can't read captchas
          unzip -l casdoor-extension.zip | grep -q "vendor/ddddocr/common_old.onnx"
          gh release upload "$tag" casdoor-extension.zip --clobber
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to the Chrome Web Store
        if: steps.package.outputs.tag != ''
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ] || [ -z "$PUBLISHER_ID" ]; then
            echo "::warning::The Chrome Web Store secrets are not set, ${{ steps.package.outputs.tag }} is only attached to the GitHub release"
            exit 0
          fi
          if ! output=$(npx --yes chrome-webstore-upload-cli@4.0.2 --source casdoor-extension.zip 2>&1); then
            echo "$output"
            # the store takes no new version while one is in review: run this job again once the review is done
            if echo "$output" | grep -q "in review"; then
              echo "::warning::A version is in review in the Chrome Web Store, ${{ steps.package.outputs.tag }} was not uploaded. Re-run this job after the review, or cancel the review in the developer console first"
              exit 0
            fi
            exit 1
          fi
          echo "$output"
        env:
          EXTENSION_ID: bnjbegmkpjbcpneclidlbloadenondlm
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
